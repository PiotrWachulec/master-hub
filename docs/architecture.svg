<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Jedna baza wiedzy. Wiele zastosowań.</title>
  <desc id="desc">Nowy materiał trafia do bronze. Agent analizuje go i włącza do rozwijanej wiki w silver. Ta sama wiedza zasila niezależne katalogi gold: wkład do ebooka, materiał do fiszek, materiały dla automatu publikującego posty oraz nową koncepcję ebooka. Gold zachowuje referencje do źródeł. Po brakujące szczegóły i dokładne cytaty można wracać do bronze.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#68798e"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #172b42; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -1px; }
      .sub { font-size: 20px; fill: #53647a; }
      .step { font-size: 20px; font-weight: 600; }
      .layer { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 26px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; fill: #53647a; }
      .path { font-family: ui-monospace, Menlo, monospace; font-size: 16px; fill: #6c592c; }
      .edge { fill: none; stroke: #68798e; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#f7f9fc"/>
  <text x="50" y="65" class="title">Jedna baza wiedzy. Wiele zastosowań.</text>
  <text x="50" y="102" class="sub">Bronze zachowuje źródła. Silver rozwija wiedzę. Gold nadaje jej formę do konkretnego celu.</text>

  <rect x="50" y="140" width="755" height="62" rx="14" fill="#e8eef8"/>
  <text x="73" y="179" class="step">1. „Wrzuć nowy materiał do mojej bazy wiedzy”</text>
  <rect x="940" y="140" width="410" height="62" rx="14" fill="#fff0c8"/>
  <text x="963" y="179" class="step">2. „Przygotuj mi z tego…”</text>

  <text x="50" y="250" class="layer">BRONZE</text>
  <rect x="50" y="270" width="300" height="344" rx="18" fill="#fff2e8" stroke="#d5ac8c" stroke-width="1.5"/>
  <text x="76" y="315" class="heading">Materiały źródłowe</text>
  <text x="76" y="359" class="body">Notatki i artykuły</text>
  <text x="76" y="390" class="body">Treść kursów i książek</text>
  <text x="76" y="421" class="body">Transkrypcje wideo</text>
  <text x="76" y="452" class="body">i podcastów</text>
  <path d="M76 480 H324" stroke="#dfc7b5"/>
  <text x="76" y="514" class="small">Oryginał lub referencja</text>
  <text x="76" y="539" class="small">+ wersja tekstowa</text>
  <text x="76" y="576" class="small">Zachowane pochodzenie i wersja.</text>

  <text x="435" y="250" class="layer">SILVER · WIKI UTRZYMYWANA PRZEZ LLM</text>
  <rect x="435" y="270" width="370" height="344" rx="18" fill="#eaf1fc" stroke="#9db9df" stroke-width="1.5"/>
  <text x="461" y="315" class="heading">Rozwijana baza wiedzy</text>
  <text x="461" y="359" class="body">Pojęcia, zasady i metody</text>
  <text x="461" y="390" class="body">Syntezy i powiązania źródeł</text>
  <text x="461" y="421" class="body">Przykłady i warunki stosowania</text>
  <text x="461" y="452" class="body">Wyjątki i sprzeczności</text>
  <path d="M461 480 H779" stroke="#b9cce5"/>
  <text x="461" y="514" class="small">Nowy materiał uzupełnia to,</text>
  <text x="461" y="539" class="small">co już wiemy o danym temacie.</text>
  <text x="461" y="576" class="small">Wiedza do wielokrotnego użycia.</text>
  <path d="M350 405 H435" class="edge"/>
  <text x="355" y="381" class="small">analiza</text>

  <text x="940" y="250" class="layer">GOLD · OSOBNY KATALOG DLA CELU</text>
  <rect x="940" y="270" width="410" height="84" rx="14" fill="#fff8e4" stroke="#dac278"/>
  <text x="965" y="304" class="step">Wkład do ebooka o XYZ</text>
  <text x="965" y="332" class="path">20-gold/ebook-o-xyz/</text>
  <rect x="940" y="374" width="410" height="84" rx="14" fill="#fff8e4" stroke="#dac278"/>
  <text x="965" y="408" class="step">Materiał do wygenerowania fiszek</text>
  <text x="965" y="436" class="path">20-gold/fiszki-xyz/</text>
  <rect x="940" y="478" width="410" height="84" rx="14" fill="#fff8e4" stroke="#dac278"/>
  <text x="965" y="512" class="step">Materiały dla automatu do postów</text>
  <text x="965" y="540" class="path">20-gold/instagram-posts-materials/</text>
  <rect x="940" y="582" width="410" height="84" rx="14" fill="#ffffff" stroke="#c0a04a" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="965" y="616" class="step">Nowa koncepcja ebooka</text>
  <text x="965" y="644" class="path">20-gold/ebook-inna-koncepcja/</text>

  <path d="M805 405 H870 V312 H940" class="edge"/>
  <path d="M870 405 V416 H940" class="edge"/>
  <path d="M870 416 V520 H940" class="edge"/>
  <path d="M870 520 V624 H940" class="edge"/>
  <text x="940" y="698" class="small">Każde opracowanie zachowuje referencje do źródeł.</text>

  <rect x="50" y="646" width="755" height="54" rx="12" fill="#e8eef8"/>
  <text x="73" y="680" class="body">Twoje korekty i nowe źródła rozwijają silver w czasie.</text>
  <path d="M620 646 V614" class="edge"/>

  <rect x="50" y="740" width="1300" height="110" rx="18" fill="#18364f"/>
  <text x="76" y="783" style="font-size:25px;font-weight:650;fill:#ffffff">Zmiana koncepcji → nowe gold z istniejącego silver.</text>
  <text x="76" y="819" style="font-size:19px;fill:#d8e7f3">Po brakujący szczegół lub dokładny cytat wracamy do konkretnego źródła w bronze.</text>
  <text x="50" y="879" class="small">Schemat pracy z agentem • Markdown / OKF • katalogi warstw znajdują się wewnątrz knowledge/</text>
</svg>
